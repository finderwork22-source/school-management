<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email verified — MojaSchool</title>
    <meta name="theme-color" content="#3b1070" />
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f8fafc; }
      .page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .card {
        width: min(100%, 460px);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 36px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      .logo {
        display: block;
        width: 190px;
        height: auto;
        margin: 0 auto 28px;
      }
      .icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #ecfdf5;
        color: #059669;
        font-size: 28px;
        font-weight: 700;
      }
      .eyebrow {
        margin: 0;
        color: #3b1070;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 12px;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: -.02em;
      }
      p {
        margin: 0;
        color: #64748b;
        font-size: 15px;
        line-height: 1.7;
      }
      .note {
        margin-top: 14px;
        color: #475569;
        font-size: 13px;
      }
      button {
        width: 100%;
        margin-top: 24px;
        height: 46px;
        border: 0;
        border-radius: 10px;
        background: #3b1070;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #2f0d5a; }
      button:disabled { opacity: .65; cursor: not-allowed; }
      .error {
        margin-top: 16px;
        color: #b91c1c;
        font-size: 13px;
        line-height: 1.5;
      }
      .brand {
        margin-top: 22px;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="title">
        <img class="logo" src="/MojaSchool.svg" alt="MojaSchool" />
        <div class="icon" aria-hidden="true">✓</div>
        <p class="eyebrow">MojaSchool</p>
        <h1 id="title">Email verified successfully</h1>
        <p>
          Your email address has been confirmed. You can now sign in to your
          MojaSchool account and continue with your school setup.
        </p>
        <p class="note">
          Your school workspace will be created or continued after you sign in.
        </p>
        <button id="continueButton" type="button">Continue to sign in</button>
        <p id="error" class="error" role="alert" hidden></p>
        <div class="brand">MojaSchool School Management</div>
      </section>
    </main>

    <script>
      (function () {
        const button = document.getElementById("continueButton");
        const error = document.getElementById("error");

        function continueToLogin() {
          button.disabled = true;
          button.textContent = "Opening sign in...";
          window.location.replace("/login?confirmed=true");
        }

        button.addEventListener("click", continueToLogin);

        // Supabase appends the verification session to the URL. Keep this page
        // visible so the user can see that confirmation succeeded before signing in.
        if (!window.location.search && !window.location.hash) {
          error.hidden = false;
          error.textContent =
            "Please use the latest confirmation email to verify your account.";
        }
      })();
    </script>
  </body>
</html>
