<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email verified — MojaSchool</title>
    <meta name="theme-color" content="#3b1070" />

    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f8fafc;
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 460px);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 36px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        text-align: center;
      }

      .logo {
        display: block;
        width: 190px;
        height: auto;
        margin: 0 auto 28px;
      }

      .icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #ecfdf5;
        color: #059669;
        font-size: 28px;
        font-weight: 700;
      }

      .icon.error-icon {
        background: #fef2f2;
        color: #dc2626;
      }

      .eyebrow {
        margin: 0;
        color: #3b1070;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 10px 0 12px;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: #64748b;
        font-size: 15px;
        line-height: 1.7;
      }

      .note {
        margin-top: 14px;
        color: #475569;
        font-size: 13px;
      }

      button {
        width: 100%;
        margin-top: 24px;
        height: 46px;
        border: 0;
        border-radius: 10px;
        background: #3b1070;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #2f0d5a;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .error {
        margin-top: 16px;
        color: #b91c1c;
        font-size: 13px;
        line-height: 1.5;
      }

      .brand {
        margin-top: 22px;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 600;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <section class="card" aria-labelledby="title">
        <img
          class="logo"
          src="/MojaSchool.svg"
          alt="MojaSchool"
        />

        <div id="successIcon" class="icon" aria-hidden="true">✓</div>
        <div id="errorIcon" class="icon error-icon hidden" aria-hidden="true">!</div>

        <p class="eyebrow">MojaSchool</p>

        <h1 id="title">Email verified successfully</h1>

        <p id="message">
          Your email address has been confirmed. You can now continue to
          MojaSchool and complete your school setup.
        </p>

        <p id="note" class="note">
          Your school request still needs to be submitted and reviewed by a
          MojaSchool administrator.
        </p>

        <button id="continueButton" type="button">
          Continue to school setup
        </button>

        <p id="errorMessage" class="error hidden" role="alert"></p>

        <div class="brand">MojaSchool School Management</div>
      </section>
    </main>

    <script>
      (function () {
        const button = document.getElementById("continueButton");
        const successIcon = document.getElementById("successIcon");
        const errorIcon = document.getElementById("errorIcon");
        const title = document.getElementById("title");
        const message = document.getElementById("message");
        const note = document.getElementById("note");
        const errorMessage = document.getElementById("errorMessage");

        const search = window.location.search || "";
        const hash = window.location.hash || "";

        const searchParams = new URLSearchParams(search);
        const hashParams = new URLSearchParams(hash.replace(/^#/, ""));

        const error =
          searchParams.get("error") ||
          hashParams.get("error");

        const errorCode =
          searchParams.get("error_code") ||
          hashParams.get("error_code");

        const errorDescription =
          searchParams.get("error_description") ||
          hashParams.get("error_description");

        const hasCallbackData =
          Boolean(search || hash);

        function decodeDescription(value) {
          if (!value) return "";

          try {
            return decodeURIComponent(value.replace(/\+/g, " "));
          } catch {
            return value;
          }
        }

        function showError() {
          successIcon.classList.add("hidden");
          errorIcon.classList.remove("hidden");

          title.textContent =
            errorCode === "otp_expired"
              ? "Confirmation link expired"
              : "Email confirmation failed";

          message.textContent =
            errorCode === "otp_expired"
              ? "This confirmation link has expired. Please request a new confirmation email and use the newest link."
              : "We could not verify this email confirmation link.";

          note.classList.add("hidden");

          errorMessage.textContent =
            decodeDescription(errorDescription) ||
            error ||
            "Please request a new confirmation email and try again.";

          errorMessage.classList.remove("hidden");

          button.textContent = "Return to sign up";
          button.onclick = function () {
            window.location.replace("/signup");
          };
        }

        function continueToSetup() {
          button.disabled = true;
          button.textContent = "Opening school setup...";

          /*
           * Keep the Supabase callback parameters when returning to the
           * React application. Supabase can then restore the authenticated
           * session before /setup-school loads.
           */
          const target = "/setup-school" + search + hash;
          window.location.replace(target);
        }

        if (error || errorCode) {
          showError();
          return;
        }

        if (!hasCallbackData) {
          successIcon.classList.add("hidden");
          errorIcon.classList.remove("hidden");

          title.textContent = "Confirmation link missing";

          message.textContent =
            "This page was opened without a valid email confirmation response.";

          note.classList.add("hidden");

          errorMessage.textContent =
            "Please use the latest confirmation email sent to your inbox.";

          errorMessage.classList.remove("hidden");

          button.textContent = "Return to sign up";
          button.onclick = function () {
            window.location.replace("/signup");
          };

          return;
        }

        button.addEventListener("click", continueToSetup);
      })();
    </script>
  </body>
</html>
